# Three services on one image (claims-mcp-dev, the Dockerfile's dev stage):
#   dev         tests and one-off commands: `docker compose run --rm dev <command>`
#   mcp_server  the MCP server: `docker compose up -d --build mcp_server`
#   cli         the whole app (server + interactive CLI): `docker compose run --build --rm cli`
# Only dev mounts the repo; mcp_server and cli run the code baked into the image, so they
# need a rebuild (--build) to pick up edits. Stop with `docker compose down` (-v: reset data).

services:
  dev:
    build:
      context: .
      target: dev
    image: claims-mcp-dev
    volumes:
      # The repo at /app, so the test hook sees edits and ruff fixes land on the host
      # without a rebuild (the venv is in /opt/venv, outside the mount).
      - .:/app
    environment:
      # Service name, not localhost. No depends_on: test runs shouldn't start the server.
      CLAIMS_MCP_SERVER_URL: http://mcp_server:8000/mcp
    env_file:
      # Foundry settings; optional so tests run without a .env.
      - path: .env
        required: false

  mcp_server:
    build:
      context: .
      target: dev
    image: claims-mcp-dev
    volumes:
      # Over data/: persists until `down -v`; seeded once from the image's two JSON files.
      # Edits to data/*.json reach it only after a rebuild and `down -v`.
      - claims_data:/app/data
    command: ["uv", "run", "python", "-m", "claims_mcp.mcp_server.server"]
    environment:
      # All interfaces, so other containers and the published port can reach it.
      CLAIMS_MCP_SERVER_HOST: 0.0.0.0
    ports:
      # Local machine only: with host 0.0.0.0 the SDK leaves DNS-rebinding protection off.
      - "127.0.0.1:8000:8000"
    healthcheck:
      # No curl in the image, so Python requests /health.
      test:
        - CMD
        - uv
        - run
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health')
      interval: 10s
      timeout: 5s
      retries: 3

  cli:
    build:
      context: .
      target: dev
    image: claims-mcp-dev
    # Kept out of a plain `docker compose up` (it needs a terminal); `run cli` enables it.
    profiles: ["cli"]
    command: ["uv", "run", "claims-mcp"]
    environment:
      # Wins over any URL in .env.
      CLAIMS_MCP_SERVER_URL: http://mcp_server:8000/mcp
    env_file:
      # Foundry settings and options such as CLAIMS_MCP_SHOW_TRACE.
      - path: .env
        required: false
    depends_on:
      # Wait for the server's healthcheck so the CLI's first connect succeeds.
      mcp_server:
        condition: service_healthy
    # The questionary prompts need open stdin and a terminal.
    stdin_open: true
    tty: true

# Outlives containers; Docker names it claims-mcp_claims_data (`docker volume ls`).
volumes:
  claims_data:
