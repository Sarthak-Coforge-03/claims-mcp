[project]
name = "claims-mcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sarthak-Coforge-03", email = "sarthak.kakkar@coforge.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.14.0",
    "mcp[cli]>=2.3.0",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "python-dateutil>=4.0.0",
]

[project.scripts]
claims-mcp = "claims_mcp:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W: pycodestyle errors and warnings · F: pyflakes (unused imports, undefined names)
# I: import sorting · B: bugbear (likely bugs) · UP: modern Python syntax for 3.12
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
# Always sort our own package into the first-party import group. Without this, ruff guesses
# from what exists on disk, so a test written before its module (TDD) gets its imports
# grouped as third-party and then flagged once the module exists.
# "fakes" is the tests/fakes package of test doubles (importable via pytest's pythonpath below).
known-first-party = ["claims_mcp", "fakes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put tests/ on the import path so tests can `import fakes...` (test doubles kept out of src/).
pythonpath = ["tests"]
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
source = ["src/claims_mcp"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80   # turn on once the four tools and their tests exist
